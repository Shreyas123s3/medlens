name: Build MedLens APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          project_root=""
          if [[ ( -f settings.gradle || -f settings.gradle.kts ) && \
                ( -f build.gradle || -f build.gradle.kts ) && \
                -f gradle.properties && -d app && \
                ( -f app/build.gradle || -f app/build.gradle.kts ) ]]; then
            project_root="."
          else
            while IFS= read -r settings_file; do
              candidate="${settings_file%/*}"
              if [[ "$candidate" == "$settings_file" ]]; then candidate="."; fi
              if [[ ( -f "$candidate/build.gradle" || -f "$candidate/build.gradle.kts" ) && \
                    -f "$candidate/gradle.properties" && -d "$candidate/app" && \
                    ( -f "$candidate/app/build.gradle" || -f "$candidate/app/build.gradle.kts" ) ]]; then
                project_root="$candidate"
                break
              fi
            done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -not -path '*/build/*' -print)
          fi

          if [[ -z "$project_root" ]]; then
            echo "::error::Android project root not found. Expected settings.gradle, build.gradle, gradle.properties, and app/ together at the repository root or in one nested project folder."
            exit 1
          fi
          echo "root=$project_root" >> "$GITHUB_OUTPUT"
          echo "Android project root: $project_root"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9 for AGP 8.7.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedLens-debug-apk
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
